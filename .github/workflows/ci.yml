name: CI

on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux : le pipeline ne peut rien écrire dans le dépôt.
permissions:
  contents: read

# Une nouvelle poussée annule l'exécution précédente de la même branche.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# Les actions de GitHub (actions/…) suivent leur version majeure. Celles des autres éditeurs sont épinglées sur un commit,
# avec la version en commentaire (Dependabot met les deux à jour) : une étiquette peut être déplacée par un pirate, comme
# cela est arrivé aux étiquettes de trivy-action, un commit non.

jobs:
  backend:
    name: Backend (compilation + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - name: Résultats de tests
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  migrations:
    name: Migrations Flyway sur MySQL réel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # Le test crée et supprime ses propres bases : installation neuve, mise à jour avec données, reprise d'une base existante.
      - run: chmod +x mvnw && ./mvnw -B test -Dtest=MigrationsMysqlIT
        env:
          GESSTOCK_TEST_MYSQL: 127.0.0.1:3306
          GESSTOCK_TEST_MYSQL_USER: root
          GESSTOCK_TEST_MYSQL_PASSWORD: ci-root-password

  frontend:
    name: Frontend (lint + tests + types + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # `npm run build` exécute `tsc -b` (vérification des types, tests compris) puis le build Vite.
      - run: npm run build

  android:
    name: Application Android (tests + APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/app/build.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      # Les machines de GitHub ont déjà les outils Android. L'APK sort non signé : la clé reste sur le PC qui livre
      # (scripts/construire-apk.cmd) ; ce job vérifie seulement que l'application se construit et que ses tests passent.
      - run: chmod +x gradlew && ./gradlew --no-daemon --console=plain test assembleRelease

  # Pas d'analyse CodeQL : sur le dépôt privé d'un compte personnel, GitHub la refuse (« Code scanning is not enabled » :
  # il faut GitHub Code Security, réservé aux organisations), et CodeQL n'est gratuit que pour le code open source.
  securite:
    name: Sécurité (dépendances, secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0          # historique complet : la recherche de secrets inspecte aussi les anciens commits
      # Rapport seulement au départ (exit-code 0) : à passer à "1" quand les alertes initiales auront été traitées,
      # pour qu'une dépendance vulnérable fasse échouer le pipeline.
      - name: Dépendances vulnérables (pom.xml et package-lock.json)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      # Tout l'historique à chaque fois : lors d'un envoi, gitleaks-action ne lit que les commits posés directement sur main
      # et saute les fusions, par lesquelles arrive tout le travail de ce dépôt. Les valeurs d'essai connues des tests sont
      # déclarées dans .gitleaks.toml. Version figée et empreinte vérifiée : à mettre à jour à la main.
      - name: Secrets committés par erreur (tout l'historique)
        env:
          GITLEAKS_VERSION: 8.24.3
          GITLEAKS_SHA256: 9991e0b2903da4c8f6122b5c3186448b927a5da4deef1fe45271c3793f4ee29c
        run: |
          curl -sSfL -o "$RUNNER_TEMP/gitleaks.tar.gz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          echo "${GITLEAKS_SHA256}  $RUNNER_TEMP/gitleaks.tar.gz" | sha256sum --check --strict -
          tar -xzf "$RUNNER_TEMP/gitleaks.tar.gz" -C "$RUNNER_TEMP" gitleaks
          "$RUNNER_TEMP/gitleaks" git --no-banner --redact --verbose .

  image:
    name: Image Docker (construction seulement)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, migrations, frontend]
    steps:
      - uses: actions/checkout@v7
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          push: false
          load: true
          tags: gesstock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Analyse de l'image (rapport seulement au départ)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: gesstock:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
