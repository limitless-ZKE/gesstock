name: CI

on:
  push:
    branches: [main]
  pull_request:

# Droits minimaux : le pipeline ne peut rien écrire dans le dépôt, sauf là où un job le demande explicitement.
permissions:
  contents: read

# Une nouvelle poussée annule l'exécution précédente de la même branche.
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend (compilation + tests)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - run: chmod +x mvnw && ./mvnw -B verify
      - name: Résultats de tests
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: surefire-reports
          path: target/surefire-reports
          retention-days: 7

  migrations:
    name: Migrations Flyway sur MySQL réel
    runs-on: ubuntu-latest
    timeout-minutes: 20
    services:
      mysql:
        image: mysql:8.4
        env:
          MYSQL_ROOT_PASSWORD: ci-root-password
        ports:
          - 3306:3306
        options: >-
          --health-cmd="mysqladmin ping -h 127.0.0.1 -pci-root-password --silent"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      # Le test crée et supprime ses propres bases : installation neuve, mise à jour avec données, reprise d'une base existante.
      - run: chmod +x mvnw && ./mvnw -B test -Dtest=MigrationsMysqlIT
        env:
          GESSTOCK_TEST_MYSQL: 127.0.0.1:3306
          GESSTOCK_TEST_MYSQL_USER: root
          GESSTOCK_TEST_MYSQL_PASSWORD: ci-root-password

  frontend:
    name: Frontend (lint + tests + types + build)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run lint
      - run: npm test
      # `npm run build` exécute `tsc -b` (vérification des types, tests compris) puis le build Vite.
      - run: npm run build

  android:
    name: Application Android (tests + APK)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    defaults:
      run:
        working-directory: android
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle
          cache-dependency-path: |
            android/*.gradle
            android/app/build.gradle
            android/gradle/wrapper/gradle-wrapper.properties
      # Les machines de GitHub ont déjà les outils Android. L'APK sort non signé : la clé reste sur le PC qui livre
      # (scripts/construire-apk.cmd) ; ce job vérifie seulement que l'application se construit et que ses tests passent.
      - run: chmod +x gradlew && ./gradlew --no-daemon --console=plain test assembleRelease

  securite:
    name: Sécurité (dépendances, secrets, analyse du code)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      security-events: write      # dépôt des résultats dans l'onglet Sécurité de GitHub
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0          # historique complet : la recherche de secrets inspecte aussi les anciens commits
      # Rapport seulement au départ (exit-code 0) : à passer à "1" quand les alertes initiales auront été traitées,
      # pour qu'une dépendance vulnérable fasse échouer le pipeline.
      - name: Dépendances vulnérables (pom.xml et package-lock.json)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          scan-type: fs
          scanners: vuln
          severity: HIGH,CRITICAL
          ignore-unfixed: true
          exit-code: "0"
      - name: Secrets committés par erreur
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: maven
      - uses: github/codeql-action/init@v3
        with:
          languages: java-kotlin,javascript-typescript
          build-mode: none
      - uses: github/codeql-action/analyze@v3

  image:
    name: Image Docker (construction seulement)
    runs-on: ubuntu-latest
    timeout-minutes: 20
    needs: [backend, migrations, frontend]
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          load: true
          tags: gesstock:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Analyse de l'image (rapport seulement au départ)
        uses: aquasecurity/trivy-action@0.28.0
        with:
          image-ref: gesstock:ci
          scanners: vuln
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "0"
