<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GesStock - Gestion des Fournisseurs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barre de navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/dashboard">GesStock</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Tableau de bord</a></li>
                    <li class="nav-item"><a class="nav-link" href="/articles">Articles</a></li>
                    <li class="nav-item"><a class="nav-link" href="/clients">Clients</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/fournisseurs">Fournisseurs</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ventes/historique">Ventes</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Liste des Fournisseurs</h2>
            <a href="/fournisseurs/nouveau" class="btn btn-success">+ Nouveau Fournisseur</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Téléphone</th>
                            <th>Email</th>
                            <th>Adresse</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${fournisseurs.empty}">
                            <td colspan="6" class="text-center text-muted">Aucun fournisseur enregistré.</td>
                        </tr>
                        <tr th:each="f : ${fournisseurs}">
                            <td th:text="${f.id}">1</td>
                            <td th:text="${f.nom}" class="fw-bold">Nom</td>
                            <td th:text="${f.telephone}">Téléphone</td>
                            <td th:text="${f.email}">Email</td>
                            <td th:text="${f.adresse}">Adresse</td>
                            <td class="text-end">
                                <a th:href="@{/fournisseurs/modifier/{id}(id=${f.id})}" class="btn btn-warning btn-sm me-1">Modifier</a>
                                <a th:href="@{/fournisseurs/supprimer/{id}(id=${f.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Voulez-vous vraiment supprimer ce fournisseur ?')">Supprimer</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
