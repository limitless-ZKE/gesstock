<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Historique des Ventes - GesStock</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
</head>
<body class="bg-light">

<nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
    <div class="container-fluid">
        <a class="navbar-brand fw-bold" href="#">GesStock</a>
        <div class="collapse navbar-collapse">
            <ul class="navbar-nav me-auto">
                <li class="nav-item"><a class="nav-link" th:href="@{/}">Tableau de bord</a></li>
                <li class="nav-item"><a class="nav-link" th:href="@{/articles}">Articles</a></li>
                <li class="nav-item"><a class="nav-link active" th:href="@{/ventes}">Ventes</a></li>
            </ul>
        </div>
    </div>
</nav>

<div class="container mt-4">
    <div class="d-flex justify-content-between align-items-center mb-3">
        <h2><i class="bi bi-cart-check"></i> Historique des Ventes</h2>
        <a th:href="@{/ventes/nouvelle}" class="btn btn-success"><i class="bi bi-plus-circle"></i> Enregistrer une Vente</a>
    </div>

    <div class="card shadow-sm">
        <div class="card-body p-0">
            <table class="table table-striped mb-0">
                <thead class="table-dark">
                    <tr>
                        <th>N° Vente</th>
                        <th>Date</th>
                        <th>Article</th>
                        <th>Quantité</th>
                        <th>Total (FCFA)</th>
                        <th class="text-center">Reçu PDF</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="v : ${ventes}">
                        <td th:text="${v.id}">1</td>
                        <td th:text="${#temporals.format(v.dateVente, 'dd/MM/yyyy HH:mm')}">01/01/2026</td>
                        <td th:text="${v.article != null ? v.article.nom : 'Article supprimé'}">Nom</td>
                        <td th:text="${v.quantite}">0</td>
                        <td th:text="${v.total}">0</td>
                        <td class="text-center">
                            <a th:href="@{/ventes/recu/{id}(id=${v.id})}" class="btn btn-sm btn-outline-danger">
                                <i class="bi bi-file-earmark-pdf"></i> Imprimer Reçu
                            </a>
                        </td>
                    </tr>
                    <tr th:if="${#lists.isEmpty(ventes)}">
                        <td colspan="6" class="text-center text-muted py-3">Aucune vente enregistrée pour le moment.</td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
