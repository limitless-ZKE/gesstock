<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GesStock - Formulaire Article</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5">
        <div class="row justify-content-center">
            <div class="col-md-6">
                <div class="card shadow-sm">
                    <div class="card-header bg-primary text-white">
                        <h4 class="mb-0" th:text="${article.id != null} ? 'Modifier l\'article' : 'Ajouter un nouvel article'">Formulaire Article</h4>
                    </div>
                    <div class="card-body">
                        <form th:action="@{/articles/enregistrer}" th:object="${article}" method="post">
                            
                            <!-- Champ caché ID pour la modification -->
                            <input type="hidden" th:field="*{id}" />

                            <div class="mb-3">
                                <label class="form-label">Désignation / Nom :</label>
                                <input type="text" th:field="*{nom}" class="form-control" required placeholder="ex: PC Portable Dell">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Prix :</label>
                                <input type="number" step="0.01" th:field="*{prix}" class="form-control" required placeholder="ex: 150000">
                            </div>

                            <div class="mb-3">
                                <label class="form-label">Quantité :</label>
                                <input type="number" th:field="*{quantite}" class="form-control" required placeholder="ex: 10">
                            </div>

                            <div class="d-flex justify-content-between mt-4">
                                <a th:href="@{/}" class="btn btn-secondary">Annuler</a>
                                <button type="submit" class="btn btn-success" th:text="${article.id != null} ? 'Mettre à jour' : 'Enregistrer le produit'">Enregistrer</button>
                            </div>

                        </form>
                    </div>
                </div>
            </div>
        </div>
    </div>

</body>
</html>
