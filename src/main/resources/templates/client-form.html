<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GesStock - Ajouter un Client</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 600px;">
        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h4 class="mb-0">Ajouter un nouveau client</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/clients/sauvegarder}" th:object="${client}" method="post">
                    
                    <!-- Champ caché indispensable pour l'ID -->
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom complet</label>
                        <input type="text" id="nom" th:field="*{nom}" class="form-control" required>
                    </div>
                    
                    <div class="mb-3">
                        <label for="telephone" class="form-label">Téléphone</label>
                        <input type="text" id="telephone" th:field="*{telephone}" class="form-control">
                    </div>
                    
                    <div class="mb-3">
                        <label for="adresse" class="form-label">Adresse</label>
                        <input type="text" id="adresse" th:field="*{adresse}" class="form-control">
                    </div>
                    
                    <div class="d-flex justify-content-between">
                        <a href="/clients" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-success">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
