<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GesStock - Nouveau Client</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.2/dist/css/bootstrap.min.css">
</head>
<body class="bg-light">

    <div class="container mt-5" style="max-width: 500px;">
        <div class="card shadow-sm">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0">Ajouter un Client</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/clients/enregistrer}" th:object="${client}" method="post">
                    <div class="mb-3">
                        <label class="form-label">Nom complet :</label>
                        <input type="text" th:field="*{nom}" class="form-control" required placeholder="Ex: Jean Dupont">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Téléphone :</label>
                        <input type="text" th:field="*{telephone}" class="form-control" placeholder="Ex: +228 90 00 00 00">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Adresse / Ville :</label>
                        <input type="text" th:field="*{adresse}" class="form-control" placeholder="Ex: Lomé">
                    </div>
                    <div class="d-flex justify-content-between">
                        <a th:href="@{/clients}" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-success">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

</body>
</html>
