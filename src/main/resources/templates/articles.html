<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GesStock - Gestion des Articles</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barre de navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/dashboard">GesStock</a>
            <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav">
                <span class="navbar-toggler-icon"></span>
            </button>
            <div class="collapse navbar-collapse" id="navbarNav">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/dashboard">Tableau de bord</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link active" href="/articles">Gestion des Articles</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ventes/nouveau">Effectuer une Vente</a>
                    </li>
                    <li class="nav-item">
                        <a class="nav-link" href="/ventes/historique">Historique Ventes</a>
                    </li>
                </ul>
                <form class="d-flex" th:action="@{/logout}" method="post">
                    <button class="btn btn-outline-light btn-sm" type="submit">Déconnexion</button>
                </form>
            </div>
        </div>
    </nav>

    <!-- Contenu Principal -->
    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Gestion des Articles</h2>
            <a href="/articles/nouveau" class="btn btn-primary">+ Nouvel Article</a>
        </div>

        <!-- Formulaire de recherche -->
        <form th:action="@{/articles}" method="get" class="row g-3 mb-4">
            <div class="col-auto">
                <input type="text" name="keyword" class="form-control" placeholder="Rechercher par nom...">
            </div>
            <div class="col-auto">
                <button type="submit" class="btn btn-dark">Chercher</button>
            </div>
        </form>

        <!-- Tableau des articles -->
        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Prix</th>
                            <th>Quantité</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${articles.empty}">
                            <td colspan="5" class="text-center text-muted">Aucun article trouvé.</td>
                        </tr>
                        <tr th:each="article : ${articles}">
                            <td th:text="${article.id}">1</td>
                            <td th:text="${article.nom}">COCA</td>
                            <td th:text="${#numbers.formatDecimal(article.prix, 0, 'WHITESPACE', 0, 'POINT')} + ' FCFA'">1 000 FCFA</td>
                            <td th:text="${article.quantite}">20</td>
                            <td>
                                <a th:href="@{/articles/editer/{id}(id=${article.id})}" class="btn btn-warning btn-sm">Éditer</a>
                                <a th:href="@{/articles/supprimer/{id}(id=${article.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet article ?');">Supprimer</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
