<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Formulaire Article</title>
    <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
<div class="container mt-5">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card">
                <div class="card-header bg-primary text-white">
                    <!-- Ligne 25 corrigée : apostrophe doublée pour SpEL -->
                    <h2 class="h5 mb-0" th:text="${article.id == null ? 'Ajouter un Article' : 'Modifier l''Article'}"></h2>
                </div>
                <div class="card-body">
                    <form th:action="@{/articles/sauvegarder}" th:object="${article}" method="post">
                        <!-- Champ caché pour l'ID de l'article -->
                        <input type="hidden" th:field="*{id}" />

                        <!-- Champ Nom -->
                        <div class="mb-3">
                            <label for="nom" class="form-label">Nom de l'article</label>
                            <input type="text" class="form-control" id="nom" th:field="*{nom}" required />
                        </div>

                        <!-- Champ Prix -->
                        <div class="mb-3">
                            <label for="prix" class="form-label">Prix</label>
                            <input type="number" step="0.01" class="form-control" id="prix" th:field="*{prix}" required />
                        </div>

                        <!-- Champ Quantité -->
                        <div class="mb-3">
                            <label for="quantite" class="form-label">Quantité en stock</label>
                            <input type="number" class="form-control" id="quantite" th:field="*{quantite}" required />
                        </div>

                        <!-- Boutons d'action -->
                        <div class="d-flex justify-content-between">
                            <a th:href="@{/articles}" class="btn btn-secondary">Annuler</a>
                            <button type="submit" class="btn btn-success">Enregistrer</button>
                        </div>
                    </form>
                </div>
            </div>
        </div>
    </div>
</div>
</body>
</html>
