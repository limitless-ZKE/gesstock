<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GesStock - Gestion des Articles</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark">
        <div class="container-fluid">
            <a class="navbar-brand" href="/">GesStock 3.0</a>
            <div class="navbar-nav">
                <a class="nav-link active" href="/articles">Articles</a>
                <a class="nav-link" href="/">Tableau de bord</a>
            </div>
        </div>
    </nav>

    <div class="container my-4">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2>Gestion des Articles</h2>
            <a href="/articles/new" class="btn btn-primary">+ Nouvel Article</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Référence</th>
                            <th>Désignation</th>
                            <th>Quantité en Stock</th>
                            <th>Seuil d'Alerte</th>
                            <th>Statut</th>
                            <th>Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:each="art : ${articles}">
                            <td th:text="${art.id}">1</td>
                            <td th:text="${art.reference}">REF001</td>
                            <td th:text="${art.designation}">Article Exemple</td>
                            <td th:text="${art.qteStock}">10</td>
                            <td th:text="${art.alerte}">5</td>
                            <td>
                                <span th:if="${art.qteStock <= art.alerte}" class="badge bg-danger">Alerte Stock</span>
                                <span th:if="${art.qteStock > art.alerte}" class="badge bg-success">OK</span>
                            </td>
                            <td>
                                <a th:href="@{/articles/edit/{id}(id=${art.id})}" class="btn btn-sm btn-warning me-1">Modifier</a>
                                <a th:href="@{/articles/delete/{id}(id=${art.id})}" class="btn btn-sm btn-danger" onclick="return confirm('Confirmer la suppression ?')">Supprimer</a>
                            </td>
                        </tr>
                        <tr th:if="${#lists.isEmpty(articles)}">
                            <td colspan="7" class="text-center text-muted">Aucun article enregistré.</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
