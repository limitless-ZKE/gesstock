<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GesStock - Formulaire Article</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container my-5" style="max-width: 600px;">
        <div class="card shadow">
            <div class="card-header bg-primary text-white">
                <h4 class="mb-0" th:text="${article.id == null ? 'Ajouter un Article' : 'Modifier l\'Article'}">Formulaire Article</h4>
            </div>
            <div class="card-body">
                <form th:action="@{/articles/save}" th:object="${article}" method="post">
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label class="form-label">Référence</label>
                        <input type="text" th:field="*{reference}" class="form-control" required placeholder="ex: ART-001"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Désignation</label>
                        <input type="text" th:field="*{designation}" class="form-control" required placeholder="ex: Ordinateur Portable"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Quantité en Stock</label>
                        <input type="number" th:field="*{qteStock}" class="form-control" required min="0"/>
                    </div>

                    <div class="mb-3">
                        <label class="form-label">Seuil d'Alerte</label>
                        <input type="number" th:field="*{alerte}" class="form-control" required min="0"/>
                    </div>

                    <div class="d-flex justify-content-between">
                        <a href="/articles" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-success">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</body>
</html>
