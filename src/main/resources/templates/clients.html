<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GesStock - Gestion des Clients</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barre de navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/dashboard">GesStock</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Tableau de bord</a></li>
                    <li class="nav-item"><a class="nav-link" href="/articles">Gestion des Articles</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/clients">Clients</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ventes/historique">Historique Ventes</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h2>Liste des Clients</h2>
            <a href="/clients/nouveau" class="btn btn-success">+ Nouveau Client</a>
        </div>

        <div class="card shadow-sm">
            <div class="card-body">
                <table class="table table-striped table-hover align-middle">
                    <thead class="table-dark">
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Téléphone</th>
                            <th>Adresse</th>
                            <th class="text-end">Actions</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${clients.empty}">
                            <td colspan="5" class="text-center text-muted">Aucun client enregistré.</td>
                        </tr>
                        <tr th:each="client : ${clients}">
                            <td th:text="${client.id}">1</td>
                            <td th:text="${client.nom}">Nom</td>
                            <td th:text="${client.telephone}">Téléphone</td>
                            <td th:text="${client.adresse}">Adresse</td>
                            <td class="text-end">
                                <!-- Bouton Modifier -->
                                <a th:href="@{/clients/modifier/{id}(id=${client.id})}" class="btn btn-warning btn-sm me-1">Modifier</a>
                                <!-- Bouton Supprimer -->
                                <a th:href="@{/clients/supprimer/{id}(id=${client.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Voulez-vous vraiment supprimer ce client ?')">Supprimer</a>
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>
</body>
</html>
