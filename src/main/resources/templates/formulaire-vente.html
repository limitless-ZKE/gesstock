<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GesStock - Effectuer une Vente</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barre de navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/dashboard">GesStock</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link" href="/dashboard">Tableau de bord</a></li>
                    <li class="nav-item"><a class="nav-link" href="/articles">Gestion des Articles</a></li>
                    <li class="nav-item"><a class="nav-link" href="/clients">Clients</a></li>
                    <li class="nav-item"><a class="nav-link active" href="/ventes/historique">Historique Ventes</a></li>
                </ul>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Enregistrer une Nouvelle Vente</h2>

        <!-- Message d'erreur éventuel -->
        <div th:if="${erreur}" class="alert alert-danger" th:text="${erreur}"></div>

        <form th:action="@{/ventes/sauvegarder}" method="post">
            
            <!-- SECTION : Sélection du Client -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-primary text-white">1. Sélection du Client</div>
                <div class="card-body">
                    <div class="mb-3">
                        <label for="clientId" class="form-label fw-bold">Client concerné :</label>
                        <select name="clientId" id="clientId" class="form-select">
                            <option value="">-- Client comptant / Passager (Optionnel) --</option>
                            <option th:each="c : ${clients}" th:value="${c.id}" th:text="${c.nom + ' (' + (c.telephone != null ? c.telephone : 'Pas de tél') + ')'}"></option>
                        </select>
                    </div>
                </div>
            </div>

            <!-- SECTION : Sélection des Articles (Panier) -->
            <div class="card shadow-sm mb-4">
                <div class="card-header bg-dark text-white">2. Articles et Quantités</div>
                <div class="card-body">
                    <div id="lignes-container">
                        <!-- Ligne dynamique d'article -->
                        <div class="row mb-3 ligne-item align-items-end">
                            <div class="col-md-7">
                                <label class="form-label">Article</label>
                                <select name="articleIds" class="form-select" required>
                                    <option value="">-- Choisir un article --</option>
                                    <option th:each="article : ${articles}" th:value="${article.id}" th:text="${article.nom + ' (Stock : ' + article.quantite + ' - Prix : ' + article.prix + ' FCFA)'}"></option>
                                </select>
                            </div>
                            <div class="col-md-3">
                                <label class="form-label">Quantité</label>
                                <input type="number" name="quantites" class="form-control" value="1" min="1" required>
                            </div>
                            <div class="col-md-2">
                                <button type="button" class="btn btn-danger w-100" onclick="supprimerLigne(this)">Supprimer</button>
                            </div>
                        </div>
                    </div>

                    <button type="button" class="btn btn-secondary btn-sm mt-2" onclick="ajouterLigne()">+ Ajouter un autre article</button>
                </div>
            </div>

            <!-- Bouton de validation -->
            <div class="d-flex justify-content-between mb-5">
                <a href="/ventes/historique" class="btn btn-outline-secondary">Annuler</a>
                <button type="submit" class="btn btn-success btn-lg">Valider et Enregistrer la Vente</button>
            </div>
        </form>
    </div>

    <!-- Script JavaScript pour gérer l'ajout dynamique de lignes d'articles -->
    <script>
        function ajouterLigne() {
            const container = document.getElementById('lignes-container');
            const premierItem = container.querySelector('.ligne-item');
            const clone = premierItem.cloneNode(true);
            
            // Réinitialiser la valeur de la quantité dans la copie
            clone.querySelector('input[name="quantites"]').value = 1;
            clone.querySelector('select[name="articleIds"]').selectedIndex = 0;
            
            container.appendChild(clone);
        }

        function supprimerLigne(button) {
            const container = document.getElementById('lignes-container');
            // Empêcher de supprimer s'il ne reste qu'une seule ligne
            if (container.getElementsByClassName('ligne-item').length > 1) {
                button.closest('.ligne-item').remove();
            } else {
                alert("La vente doit contenir au moins un article.");
            }
        }
    </script>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
