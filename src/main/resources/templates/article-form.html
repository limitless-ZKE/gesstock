<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GesStock - Formulaire Article</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barre de navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/dashboard">GesStock</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item">
                        <a class="nav-link" href="/articles">Gestion des Articles</a>
                    </li>
                </ul>
            </div>
        </div>
    </nav>

    <!-- Contenu Principal -->
    <div class="container col-md-6">
        <div class="card shadow-sm">
            <div class="card-body">
                <h2 class="mb-4 text-center">Formulaire Article</h2>

                <!-- Formulaire lié à l'objet article -->
                <form th:action="@{/articles/sauvegarder}" method="post" th:object="${article}">
                    
                    <!-- Champ caché pour l'ID (nécessaire en cas de modification) -->
                    <input type="hidden" th:field="*{id}" />

                    <div class="mb-3">
                        <label for="nom" class="form-label">Nom de l'article :</label>
                        <input type="text" id="nom" th:field="*{nom}" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label for="prix" class="form-label">Prix (FCFA) :</label>
                        <input type="number" step="0.01" id="prix" th:field="*{prix}" class="form-control" required />
                    </div>

                    <div class="mb-3">
                        <label for="quantite" class="form-label">Quantité en stock :</label>
                        <input type="number" id="quantite" th:field="*{quantite}" class="form-control" required />
                    </div>

                    <div class="d-flex justify-content-between">
                        <a th:href="@{/articles}" class="btn btn-secondary">Annuler</a>
                        <button type="submit" class="btn btn-success">Enregistrer</button>
                    </div>
                </form>
            </div>
        </div>
    </div>

    <!-- Bootstrap JS -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
