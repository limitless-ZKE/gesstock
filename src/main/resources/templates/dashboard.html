<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Tableau de bord - GesStock</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">

    <!-- Barre de navigation -->
    <nav class="navbar navbar-expand-lg navbar-dark bg-dark mb-4">
        <div class="container-fluid">
            <a class="navbar-brand fw-bold" href="/dashboard">GesStock</a>
            <div class="collapse navbar-collapse">
                <ul class="navbar-nav me-auto">
                    <li class="nav-item"><a class="nav-link active" href="/dashboard">Tableau de bord</a></li>
                    <li class="nav-item"><a class="nav-link" href="/articles">Gestion des Articles</a></li>
                    <li class="nav-item"><a class="nav-link" href="/clients">Clients</a></li>
                    <li class="nav-item"><a class="nav-link" href="/ventes/historique">Historique Ventes</a></li>
                </ul>
                <form th:action="@{/logout}" method="post" class="d-inline">
                    <button type="submit" class="btn btn-outline-light btn-sm">Déconnexion</button>
                </form>
            </div>
        </div>
    </nav>

    <div class="container">
        <h2 class="mb-4">Tableau de Bord</h2>

        <div class="row mb-4">
            <div class="col-md-6">
                <div class="card text-white bg-primary shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Total Articles</h5>
                        <p class="card-text fs-4" th:text="${totalArticles}">0</p>
                    </div>
                </div>
            </div>
            <div class="col-md-6">
                <div class="card text-white bg-danger shadow-sm">
                    <div class="card-body">
                        <h5 class="card-title">Chiffre d'Affaires Global</h5>
                        <p class="card-text fs-4" th:text="${chiffreAffaires} + ' FCFA'">0 FCFA</p>
                    </div>
                </div>
            </div>
        </div>

        <div class="card shadow-sm">
            <div class="card-header bg-dark text-white">
                <h5 class="mb-0">Liste Globale des Articles</h5>
            </div>
            <div class="card-body">
                <table class="table table-striped table-hover">
                    <thead>
                        <tr>
                            <th>ID</th>
                            <th>Nom</th>
                            <th>Prix (FCFA)</th>
                            <th>Quantité</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr th:if="${articles.empty}">
                            <td colspan="4" class="text-center text-muted">Aucun article disponible.</td>
                        </tr>
                        <tr th:each="article : ${articles}">
                            <td th:text="${article.id}">1</td>
                            <td th:text="${article.nom}">Nom</td>
                            <td th:text="${article.prix}">0</td>
                            <td th:text="${article.quantite}">0</td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </div>
    </div>

</body>
</html>
