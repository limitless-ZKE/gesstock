<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GesStock - Rapports & Statistiques</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Chart.js pour les graphiques -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
</head>
<body class="bg-light">

    <nav class="navbar navbar-dark bg-dark">
        <div class="container-fluid">
            <span class="navbar-brand mb-0 h1">GesStock 3.0</span>
            <div>
                <a th:href="@{/}" class="btn btn-outline-light btn-sm me-2"> Tableau de Bord</a>
                <a th:href="@{/ventes/historique}" class="btn btn-outline-info btn-sm">📜 Historique des Ventes</a>
            </div>
        </div>
    </nav>

    <div class="container mt-4">
        <h2 class="mb-4">Rapports & Statistiques</h2>

        <div class="row">
            <!-- Graphique de l'évolution des ventes -->
            <div class="col-lg-8 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0">Évolution du Chiffre d'Affaires</h5>
                    </div>
                    <div class="card-body">
                        <canvas id="graphiqueVentes" height="150"></canvas>
                    </div>
                </div>
            </div>

            <!-- Top 5 des articles vendus -->
            <div class="col-lg-4 mb-4">
                <div class="card shadow-sm">
                    <div class="card-header bg-white">
                        <h5 class="card-title mb-0">🏆 Top 5 - Articles les plus vendus</h5>
                    </div>
                    <div class="card-body">
                        <ul class="list-group list-group-flush">
                            <li th:each="item, stat : ${topVendus}" class="list-group-item d-flex justify-content-between align-items-center">
                                <div>
                                    <span class="badge bg-primary rounded-pill me-2" th:text="${stat.count}">1</span>
                                    <strong th:text="${item[0]}">Nom Article</strong>
                                </div>
                                <span class="badge bg-success" th:text="${item[1]} + ' vendus'">0 vendus</span>
                            </li>
                            <li th:if="${#lists.isEmpty(topVendus)}" class="list-group-item text-center text-muted">
                                Aucune vente enregistrée.
                            </li>
                        </ul>
                    </div>
                </div>
            </div>
        </div>
    </div>

    <script>
        document.addEventListener("DOMContentLoaded", function() {
            fetch('/api/ventes-donnees')
                .then(response => response.json())
                .then(data => {
                    const ctx = document.getElementById('graphiqueVentes').getContext('2d');
                    new Chart(ctx, {
                        type: 'line',
                        data: {
                            labels: data.labels,
                            datasets: [{
                                label: 'Montant de la Vente (FCFA)',
                                data: data.montants,
                                borderColor: '#0d6efd',
                                backgroundColor: 'rgba(13, 110, 253, 0.1)',
                                fill: true,
                                tension: 0.3
                            }]
                        },
                        options: {
                            responsive: true,
                            scales: {
                                y: {
                                    beginAtZero: true
                                }
                            }
                        }
                    });
                });
        });
    </script>
</body>
</html>
