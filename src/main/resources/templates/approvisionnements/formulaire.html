<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GesStock - Nouvel Approvisionnement</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
</head>
<body class="container mt-4">

    <h2 class="mb-4">Enregistrer un Approvisionnement</h2>

    <form th:action="@{/approvisionnements/enregistrer}" th:object="${approvisionnement}" method="post">
        
        <div class="mb-3">
            <label class="form-label">Fournisseur :</label>
            <select th:field="*{fournisseur.id}" class="form-control" required>
                <option value="">-- Choisir un fournisseur --</option>
                <option th:each="f : ${fournisseurs}" th:value="${f.id}" th:text="${f.nom}"></option>
            </select>
        </div>

        <div class="mb-3">
            <label class="form-label">Date :</label>
            <input type="date" th:field="*{dateApprovisionnement}" class="form-control" required />
        </div>

        <hr>
        <h4>Article Acheté</h4>

        <!-- Exemple avec la première ligne de la liste -->
        <div class="row" th:if="${not #lists.isEmpty(approvisionnement.lignes)}">
            <div class="col-md-5 mb-3">
                <label class="form-label">Article :</label>
                <select th:field="*{lignes[0].article.id}" class="form-control" required>
                    <option value="">-- Choisir un article --</option>
                    <option th:each="art : ${articles}" th:value="${art.id}" th:text="${art.nom}"></option>
                </select>
            </div>
            
            <div class="col-md-3 mb-3">
                <label class="form-label">Quantité :</label>
                <input type="number" th:field="*{lignes[0].quantite}" class="form-control" min="1" required />
            </div>

            <div class="col-md-4 mb-3">
                <label class="form-label">Prix Unitaire d'Achat :</label>
                <input type="number" step="0.01" th:field="*{lignes[0].prixUnitaire}" class="form-control" required />
            </div>
        </div>

        <button type="submit" class="btn btn-success">Enregistrer et Mettre à jour le stock</button>
        <a th:href="@{/approvisionnements}" class="btn btn-secondary">Annuler</a>
    </form>

</body>
</html>
