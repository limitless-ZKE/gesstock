<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>GesStock - Liste des Approvisionnements</title>
    <link rel="stylesheet" th:href="@{/webjars/bootstrap/5.3.3/css/bootstrap.min.css}">
</head>
<body class="container mt-4">

    <div class="d-flex justify-content-between align-items-center mb-4">
        <h2>Gestion des Approvisionnements</h2>
        <a th:href="@{/approvisionnements/nouveau}" class="btn btn-primary">+ Nouvel Approvisionnement</a>
    </div>

    <table class="table table-striped table-bordered">
        <thead class="table-dark">
            <tr>
                <th>ID</th>
                <th>Date</th>
                <th>Fournisseur</th>
                <th>Actions</th>
            </tr>
        </thead>
        <tbody>
            <tr th:each="app : ${approvisionnements}">
                <td th:text="${app.id}"></td>
                <td th:text="${#temporals.format(app.dateApprovisionnement, 'dd-MM-yyyy')}"></td>
                <td th:text="${app.fournisseur != null ? app.fournisseur.nom : 'Inconnu'}"></td>
                <td>
                    <a th:href="@{/approvisionnements/supprimer/{id}(id=${app.id})}" 
                       class="btn btn-danger btn-sm" 
                       onclick="return confirm('Êtes-vous sûr de vouloir supprimer cet approvisionnement ?');">Supprimer</a>
                </td>
            </tr>
            <tr th:if="${#lists.isEmpty(approvisionnements)}">
                <td colspan="4" class="text-center">Aucun approvisionnement enregistré.</td>
            </tr>
        </tbody>
    </table>

    <a th:href="@{/}" class="btn btn-secondary mt-3">Retour à l'accueil</a>

</body>
</html>
