spring.application.name=gesstock
server.port=${SERVER_PORT:8080}

spring.datasource.url=${DB_URL:jdbc:mysql://mysql:3306/gesstock_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true}
spring.datasource.username=${DB_USERNAME:gesstock}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Le schéma est géré par Flyway (db/migration) ; Hibernate se contente de le valider.
# Une base existante créée par ddl-auto=update est reprise automatiquement (baseline en version 1).
spring.flyway.enabled=true
spring.flyway.baseline-on-migrate=true
spring.flyway.baseline-version=1
spring.jpa.hibernate.ddl-auto=${JPA_DDL_AUTO:validate}
spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Premier administrateur, créé seulement si la table des utilisateurs est vide (12 caractères minimum).
app.bootstrap.admin.username=${APP_ADMIN_USERNAME:}
app.bootstrap.admin.password=${APP_ADMIN_PASSWORD:}

# Origines autorisées pour CORS (séparées par des virgules) : URL publique du frontend.
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}
