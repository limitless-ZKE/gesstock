spring.application.name=gesstock

# Configuration MySQL (WampServer)
spring.datasource.url=jdbc:mysql://localhost:3306/gesstock_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# Configuration JPA / Hibernate
# spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
spring.jpa.open-in-view=false

# Flyway n'est utilisé qu'en production (profil prod) ; en dev le schéma suit les entités (ddl-auto=update).
spring.flyway.enabled=false

# CORS : origine du frontend Vite en développement
app.cors.allowed-origins=http://localhost:5173